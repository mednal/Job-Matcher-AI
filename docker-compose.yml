# JuniorJob AI — local development services.
#
# PostgreSQL is published on host port 5433, not the default 5432: this machine
# already runs an unrelated PostgreSQL installation on 5432. Nothing in this file
# touches that installation.
#
# Credentials come from the root .env file (see .env.example). Never commit .env.
name: juniorjob

services:
  postgres:
    image: postgres:18
    container_name: juniorjob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — the container keeps the standard 5432 internally.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      # postgres:18 sets PGDATA=/var/lib/postgresql/18/docker and declares
      # /var/lib/postgresql as its volume, so the mount goes on the parent.
      - juniorjob_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  juniorjob_postgres_data:
    name: juniorjob_postgres_data
